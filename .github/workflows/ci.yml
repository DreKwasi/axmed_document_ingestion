name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --project backend --all-groups

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Backend lint (Ruff)
        run: env PYTHONPATH=backend uv run --project backend ruff check backend

      - name: Backend tests (Pytest)
        run: env PYTHONPATH=backend uv run --project backend pytest backend/tests -v

      - name: Frontend lint (ESLint)
        run: npm --prefix frontend run lint

      - name: Frontend unit & component tests (Vitest)
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: End-to-end smoke tests (Playwright)
        run: npm --prefix frontend run test:e2e
